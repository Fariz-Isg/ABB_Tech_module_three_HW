spring:
    application:
        name: module3-HW
    profiles:
        active: dev
    datasource:
      url: jdbc:postgresql:///car_service_db
      username: postgres
      password: postgres
      driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
server:
    port: 8080

app:
  env: default
  version: 1.0.0
  name: Car Service