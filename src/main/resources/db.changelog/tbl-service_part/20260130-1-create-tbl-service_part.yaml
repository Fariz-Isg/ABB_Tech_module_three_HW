databaseChangeLog:
  - changeSet:
      id: 20260130-1-create-tbl-service_part
      author: fariz
      changes:
        - createTable:
            tableName: service_part
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: service_part_pkey
              - column:
                  name: service_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_service_part_service_visit
                    references: service_visit(id)
              - column:
                  name: part_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_service_part_part
                    references: part(id)
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false