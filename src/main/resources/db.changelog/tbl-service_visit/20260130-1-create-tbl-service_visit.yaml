databaseChangeLog:
  - changeSet:
      id: 20260130-1-create-tbl-service_visit
      author: fariz
      changes:
        - createTable:
            tableName: service_visit
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: service_visit_pkey
              - column:
                  name: car_id
                  type: integer
                  constraints:
                    nullable: false
                    foreignKeyName: fk_service_visit_car
                    references: car(id)
              - column:
                  name: service_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: odometer_km
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: service_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: varchar(255)