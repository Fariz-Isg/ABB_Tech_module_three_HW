databaseChangeLog:
  - changeSet:
      id: 20260130-1-create-tbl-part
      author: fariz
      changes:
        - createTable:
            tableName: part
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: part_pkey
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: part_code
                  type: varchar(255)
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: unit_price
                  type: numeric(10, 2)
              - column:
                  name: brand
                  type: varchar(255)