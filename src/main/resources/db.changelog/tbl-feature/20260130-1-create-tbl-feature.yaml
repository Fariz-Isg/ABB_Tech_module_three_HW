databaseChangeLog:
  - changeSet:
      id: 20260130-1-create-tbl-feature
      author: fariz
      changes:
        - createTable:
            tableName: feature
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: feature_pkey
              - column:
                  name: feature_id
                  type: integer
                  constraints:
                    unique: true
                    uniqueConstraintName: feature_feature_id_key
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: category
                  type: varchar(255)