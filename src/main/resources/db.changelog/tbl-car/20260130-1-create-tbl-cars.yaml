databaseChangeLog:
  - changeSet:
      id: 20260130-1-create-tbl-cars.yaml
      author: car-service
      changes:
        - createTable:
            tableName: cars
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: color
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: speed
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: vin_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: model_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: cars
            baseColumnNames: model_id
            constraintName: fk_cars_model
            referencedTableName: models
            referencedColumnNames: id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_car_model_id
            tableName: cars
            columns:
              - column:
                  name: model_id
        - createIndex:
            indexName: idx_car_color
            tableName: cars
            columns:
              - column:
                  name: color
        - createIndex:
            indexName: idx_car_price
            tableName: cars
            columns:
              - column:
                  name: price