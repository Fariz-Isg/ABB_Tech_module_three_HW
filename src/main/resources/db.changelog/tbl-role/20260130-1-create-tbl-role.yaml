databaseChangeLog:
  - changeSet:
      id: 20260130-1-create-table-role
      author: fariz
      changes:
        - createTable:
            tableName: role
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: text