spring:
    application:
        name: module3-HW
    datasource:
        url: jdbc:postgresql:///mydb
        driver-class-name: org.postgresql.Driver
        username: postgres
        password: postgres
    jpa:
      hibernate:
            ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect
      defer-datasource-initialization: true
    sql:
        init:
          mode: always
          data-locations: classpath:data.sql
          continue-on-error: true
server:
    port: 8080

app:
    env: default
    version: 1.0.0